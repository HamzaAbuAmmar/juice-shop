name: Semgrep Scan with HTML Report

on:
  pull_request:
    branches:
      - '**'

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # Needed to upload job summary

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep and export SARIF
        run: semgrep scan --config=auto --sarif -o semgrep.sarif

      - name: Generate HTML report from SARIF
        run: |
          pip install sarif-tools
          mkdir semgrep-html
          sarif-html semgrep.sarif > semgrep-html/index.html

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Semgrep HTML Report
          path: semgrep-html

      - name: Post link to report in job summary
        run: echo "🔗 [Download Semgrep HTML Report](./semgrep-html/index.html)" >> $GITHUB_STEP_SUMMARY
